<body>
<div id="root"><div id="esc-loading">Carregando Portal Escolar…</div></div>

<script>
  // Kill-switch: remove qualquer service worker/cache antigo que possa
  // estar travando o app numa versão quebrada anterior.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((r) => r.unregister());
    }).catch(() => {});
  }
  if (window.caches && caches.keys) {
    caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
  }

  // Diagnóstico: se der erro ou demorar demais, mostra o motivo na tela
  // em vez de ficar girando pra sempre.
  window.addEventListener("error", (e) => {
    const el = document.getElementById("esc-loading");
    if (el) {
      el.innerHTML = "Erro ao carregar: " + (e.message || "erro desconhecido") +
        "<br><small>Tente recarregar a página. Se persistir, avise o suporte.</small>";
      el.style.flexDirection = "column";
      el.style.textAlign = "center";
      el.style.padding = "24px";
    }
  });

  setTimeout(() => {
    if (!window.__escOk) {
      const el = document.getElementById("esc-loading");
      if (el && el.textContent.indexOf("Carregando") !== -1) {
        el.innerHTML = "O app está demorando para carregar.<br>" +
          "Verifique sua conexão com a internet e recarregue a página." +
          "<br><small>Se o problema continuar, pode ser bloqueio de rede aos scripts do React/Babel.</small>";
        el.style.flexDirection = "column";
        el.style.textAlign = "center";
        el.style.padding = "24px";
      }
    }
  }, 12000);
</script>

function materiasPadrao() {
  return Object.entries(PROFESSOR_POR_MATERIA).map(([nome, professor]) => ({
    nome, professor, bimestres: [null, null, null, null], frequencia: 100,

const TIPO_INFO = {
  dificuldade: { label: "Dificuldade", cor: "amber" },
  comportamento: { label: "Comportamento", cor: "red" },
  elogio: { label: "Elogio", cor: "green" },
  aviso: { label: "Aviso geral", cor: "blue" },
  diretoria: { label: "Chamado à direção", cor: "red" },
  evento: { label: "Comunicado da coordenação", cor: "blue" },
};

const STATUS_LABEL = {
  aprovado: "Aprovado",
  recuperacao: "Recuperação",
  reprovado: "Reprovado",
  andamento: "Em curso",
};

/* ---------- Funções auxiliares ---------- */

function media(bimestres) {
  const vals = bimestres.filter((v) => v !== null && v !== undefined && v !== "");
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + Number(b), 0) / vals.length;
}

function statusMateria(materia) {
  if (materia.bimestres.some((v) => v === null || v === undefined || v === "")) return "andamento";
  const m = media(materia.bimestres);
  if (materia.frequencia < 75) return "reprovado";
  if (m >= 6) return "aprovado";
  if (m >= 4) return "recuperacao";
  return "reprovado";
}

function fmt(n) {
  return n === null || n === undefined ? "—" : n.toFixed(1);
}

function ultimoRegistro(registros, alunoId, tipo) {
  const lista = registros.filter((r) => r.alunoId === alunoId && r.tipo === tipo);
  if (lista.length === 0) return null;
  return lista.reduce((a, b) => (b.id > a.id ? b : a));
}

/* ---------- Componentes pequenos ---------- */

function StampBadge({ status }) {
  return <span className={`esc-stamp esc-stamp--${status}`}>{STATUS_LABEL[status]}</span>;
}

function Card({ label, value, sub }) {
  return (
    <div className="esc-card">
      <div className="esc-card-label">{label}</div>
      <div className="esc-card-value">{value}</div>
      {sub && <div className="esc-card-sub">{sub}</div>}
    </div>
  );
}

function AvisoItem({ aviso, alunoNome }) {
  const info = TIPO_INFO[aviso.tipo] || TIPO_INFO.aviso;
  return (
    <div className={`esc-aviso esc-aviso--${info.cor}`}>
      <div className="esc-aviso-top">
        <span className="esc-aviso-tag">{info.label}</span>
        <span className="esc-aviso-data">{aviso.data}</span>
      </div>
      {alunoNome && <div className="esc-aviso-aluno">{alunoNome} · {aviso.materia}</div>}
      {!alunoNome && <div className="esc-aviso-aluno">{aviso.materia}</div>}
      <p className="esc-aviso-texto">{aviso.texto}</p>
      <div className="esc-aviso-de">— {aviso.professor}</div>
    </div>
  );
}

/* ---------- Painel do responsável ---------- */

function PaiDashboard({ students, avisos, reforcos, registros, onConfirmarReforco }) {
  const [childId, setChildId] = useState(students[0].id);

  const child = students.find((s) => s.id === childId);
  const freqGeral = Math.round(child.materias.reduce((a, m) => a + m.frequencia, 0) / child.materias.length);
  const medias = child.materias.map((m) => media(m.bimestres)).filter((v) => v !== null);
  const mediaGeral = medias.length ? (medias.reduce((a, b) => a + b, 0) / medias.length).toFixed(1) : "—";

  const meusAvisos = avisos.filter((a) => a.alunoId === childId).sort((a, b) => b.id - a.id);
  const meusReforcos = reforcos.filter((r) => r.alunoId === childId).sort((a, b) => b.id - a.id);
  const reforcosPendentes = meusReforcos.filter((r) => r.status === "aguardando").length;

  const meusRegistros = registros.filter((r) => r.alunoId === childId).sort((a, b) => b.id - a.id);
  const entradaHoje = ultimoRegistro(registros, childId, "entrada");
  const saidaHoje = ultimoRegistro(registros, childId, "saida");

  return (
    <div className="esc-page">
      {students.length > 1 && (
        <div className="esc-tabs esc-tabs--children">
          {students.map((s) => (
            <button
              key={s.id}
              className={`esc-tab ${childId === s.id ? "esc-tab--active" : ""}`}
              onClick={() => setChildId(s.id)}
            >
              {s.nome.split(" ")[0]} <span className="esc-tab-sub">{s.turma}</span>
            </button>
          ))}
        </div>
      )}

      <h2 className="esc-h2">{child.nome} <span className="esc-h2-sub">{child.turma}</span></h2>

      <div className="esc-cards-row">
        <Card label="Entrada hoje" value={entradaHoje ? entradaHoje.hora : "—"} sub={entradaHoje ? entradaHoje.data : "sem registro"} />
        <Card label="Saída hoje" value={saidaHoje ? saidaHoje.hora : "—"} sub={saidaHoje ? saidaHoje.data : "ainda na escola / sem registro"} />
        <Card label="Frequência geral" value={`${freqGeral}%`} />
        <Card label="Média geral" value={mediaGeral} />
        <Card label="Nota de comportamento" value={fmt(child.comportamento)} />
        {reforcosPendentes > 0 && <Card label="Reforço aguardando você" value={reforcosPendentes} sub="confirme o recebimento abaixo" />}
      </div>

      <h3 className="esc-h3">Entrada e saída — histórico</h3>
      {meusRegistros.length === 0 && <p className="esc-empty">Nenhum registro de entrada ou saída ainda.</p>}
      <div className="esc-table-wrap">
        <table className="esc-table">
          <thead><tr><th>Data</th><th>Tipo</th><th>Horário</th></tr></thead>
          <tbody>
            {meusRegistros.slice(0, 6).map((r) => (
              <tr key={r.id}>
                <td className="esc-td-mono">{r.data}</td>
                <td className="esc-td-strong">{r.tipo === "entrada" ? "Entrada" : "Saída"}</td>
                <td className="esc-td-mono">{r.hora}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h3 className="esc-h3">Boletim anual</h3>
      <div className="esc-table-wrap">
        <table className="esc-table">
          <thead>
            <tr>
              <th>Matéria</th>
              <th>Professor(a)</th>
              <th>1º Bim</th>
              <th>2º Bim</th>
              <th>3º Bim</th>
              <th>4º Bim</th>
              <th>Média</th>
              <th>Frequência</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody>
            {child.materias.map((m) => (
              <tr key={m.nome}>
                <td className="esc-td-strong">{m.nome}</td>
                <td>{m.professor}</td>
                {m.bimestres.map((b, i) => (
                  <td key={i} className="esc-td-mono">{fmt(b)}</td>
                ))}
                <td className="esc-td-mono esc-td-strong">{fmt(media(m.bimestres))}</td>
                <td className="esc-td-mono">{m.frequencia}%</td>
                <td><StampBadge status={statusMateria(m)} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h3 className="esc-h3">Avisos dos professores</h3>
      {meusAvisos.length === 0 && <p className="esc-empty">Nenhum aviso por enquanto.</p>}
      <div className="esc-aviso-list">
        {meusAvisos.map((a) => (
          <AvisoItem key={a.id} aviso={a} />
        ))}
      </div>

      <h3 className="esc-h3">Solicitações de reforço enviadas pelo professor</h3>
      {meusReforcos.length === 0 && <p className="esc-empty">Nenhum pedido de reforço até o momento.</p>}
      <div className="esc-aviso-list">
        {meusReforcos.map((r) => (
          <div key={r.id} className="esc-aviso esc-aviso--amber">
            <div className="esc-aviso-top">
              <span className="esc-aviso-tag">Reforço · {r.materia}</span>
              <span className="esc-aviso-data">{r.data}</span>
            </div>
            <p className="esc-aviso-texto">{r.motivo}</p>
            <div className="esc-aviso-top" style={{ marginTop: 8 }}>
              <span className={`esc-pill esc-pill--${r.status === "confirmado" ? "green" : "amber"}`}>
                {r.status === "confirmado" ? "Ciência confirmada" : "Aguardando sua confirmação"}
              </span>
              {r.status !== "confirmado" && (
                <button className="esc-btn esc-btn--primary esc-btn--sm" onClick={() => onConfirmarReforco(r.id)}>
                  Confirmar recebimento
                </button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Painel do professor ---------- */

function ProfessorDashboard({ students, avisos, reforcos, onUpdateNota, onUpdateFrequencia, onAddAviso, onAddReforco }) {
  const turmas = [...new Set(students.map((s) => s.turma))];
  const [turma, setTurma] = useState(turmas[0]);
  const alunosTurma = students.filter((s) => s.turma === turma);
  const [alunoId, setAlunoId] = useState(alunosTurma[0]?.id);
  const [tab, setTab] = useState("frequencia");

  const aluno = students.find((s) => s.id === alunoId) || alunosTurma[0];

  function selecionarTurma(t) {
    setTurma(t);
    const primeiro = students.find((s) => s.turma === t);
    setAlunoId(primeiro?.id);
  }

  return (
    <div className="esc-page">
      <div className="esc-tabs">
        {turmas.map((t) => (
          <button key={t} className={`esc-tab ${turma === t ? "esc-tab--active" : ""}`} onClick={() => selecionarTurma(t)}>
            {t}
          </button>
        ))}
      </div>

      <div className="esc-aluno-strip">
        {alunosTurma.map((s) => (
          <button key={s.id} className={`esc-aluno-chip ${alunoId === s.id ? "esc-aluno-chip--active" : ""}`} onClick={() => setAlunoId(s.id)}>
            {s.nome}
          </button>
        ))}
      </div>

      {aluno && (
        <>
          <h2 className="esc-h2">{aluno.nome} <span className="esc-h2-sub">{aluno.turma}</span></h2>

          <div className="esc-tabs esc-tabs--sub">
            {[
              ["frequencia", "Frequência"],
              ["notas", "Notas"],
              ["observacoes", "Comportamento e observações"],
              ["reforcos", "Solicitar reforço"],
            ].map(([id, label]) => (
              <button key={id} className={`esc-tab esc-tab--sm ${tab === id ? "esc-tab--active" : ""}`} onClick={() => setTab(id)}>
                {label}
              </button>
            ))}
          </div>

          {tab === "frequencia" && <FrequenciaTab aluno={aluno} onUpdateFrequencia={onUpdateFrequencia} />}
          {tab === "notas" && <NotasTab aluno={aluno} onUpdateNota={onUpdateNota} />}
          {tab === "observacoes" && (
            <ObservacoesTab aluno={aluno} avisos={avisos.filter((a) => a.alunoId === aluno.id)} onAddAviso={onAddAviso} />
          )}
          {tab === "reforcos" && (
            <SolicitarReforcoTab
              aluno={aluno}
              reforcosTurma={reforcos.filter((r) => alunosTurma.some((s) => s.id === r.alunoId))}
              students={alunosTurma}
              onAddReforco={onAddReforco}
            />
          )}
        </>
      )}
    </div>
  );
}

function FrequenciaTab({ aluno, onUpdateFrequencia }) {
  const [materiaSel, setMateriaSel] = useState(aluno.materias[0].nome);
  const [status, setStatus] = useState("presente");
  const [msg, setMsg] = useState("");

  function lancar() {
    onUpdateFrequencia(aluno.id, materiaSel, status === "falta" ? -2 : 1);
    setMsg(`Registro de hoje (31/07) lançado para ${materiaSel}.`);
    setTimeout(() => setMsg(""), 3000);
  }

  return (
    <div>
      <div className="esc-table-wrap">
        <table className="esc-table">
          <thead><tr><th>Matéria</th><th>Frequência acumulada</th></tr></thead>
          <tbody>
            {aluno.materias.map((m) => (
              <tr key={m.nome}>
                <td className="esc-td-strong">{m.nome}</td>
                <td className="esc-td-mono">{m.frequencia}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="esc-form-card" style={{ marginTop: 14 }}>
        <div className="esc-form-title">Lançar chamada de hoje (31/07)</div>
        <div className="esc-form-row">
          <label className="esc-field">
            <span>Matéria</span>
            <select value={materiaSel} onChange={(e) => setMateriaSel(e.target.value)}>
              {aluno.materias.map((m) => <option key={m.nome} value={m.nome}>{m.nome}</option>)}
            </select>
          </label>
          <label className="esc-field">
            <span>Situação</span>
            <select value={status} onChange={(e) => setStatus(e.target.value)}>
              <option value="presente">Presente</option>
              <option value="falta">Falta</option>
            </select>
          </label>
        </div>
        <div className="esc-form-actions">
          <button className="esc-btn esc-btn--primary" onClick={lancar}>Lançar</button>
        </div>
        {msg && <div className="esc-toast">{msg}</div>}
      </div>
    </div>
  );
}

function PortalEscolar() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [role, setRole] = useState(null);
  const [students, setStudents] = useState(INITIAL_STUDENTS);
  const [avisos, setAvisos] = useState(INITIAL_AVISOS);
  const [reforcos, setReforcos] = useState(INITIAL_REFORCOS);
  const [registros, setRegistros] = useState(INITIAL_REGISTROS);

  function onUpdateNota(alunoId, materiaNome, idx, valorStr) {
    const valor = valorStr === "" ? null : Math.max(0, Math.min(10, Number(valorStr)));
    setStudents((prev) =>
      prev.map((s) =>
        s.id !== alunoId ? s : {
          ...s,
          materias: s.materias.map((m) =>
            m.nome !== materiaNome ? m : { ...m, bimestres: m.bimestres.map((b, i) => (i === idx ? valor : b)) }
          ),
        }
      )
    );
  }

  function onUpdateFrequencia(alunoId, materiaNome, delta) {
    setStudents((prev) =>
      prev.map((s) =>
        s.id !== alunoId ? s : {
          ...s,
          materias: s.materias.map((m) =>
            m.nome !== materiaNome ? m : { ...m, frequencia: Math.max(0, Math.min(100, m.frequencia + delta)) }
          ),
        }
      )
    );
  }

  function onAddAviso(alunoId, materia, tipo, texto) {
    setAvisos((prev) => [{ id: Date.now(), alunoId, professor: "Carlos Souza", materia, tipo, texto, data: "31/07", lido: false }, ...prev]);
  }

  function onAddReforco(alunoId, materia, motivo) {
    setReforcos((prev) => [{ id: Date.now(), alunoId, materia, motivo, data: "31/07", status: "aguardando", lido: false }, ...prev]);
  }

  function onConfirmarReforco(id) {
    setReforcos((prev) => prev.map((r) => (r.id === id ? { ...r, status: "confirmado" } : r)));
  }

  function onAddComunicado(alunoId, tipo, texto) {
    setAvisos((prev) => [{ id: Date.now(), alunoId, professor: "Coordenação Pedagógica", materia: tipo === "diretoria" ? "Direção" : "Coordenação", tipo, texto, data: "31/07", lido: false }, ...prev]);
  }

  function onAddAluno(nome, turma, responsavel) {
    setStudents((prev) => [...prev, { id: Date.now(), nome, turma, responsavel, comportamento: null, materias: materiasPadrao() }]);
  }

  function onAddRegistro(alunoId, tipo, hora) {
    setRegistros((prev) => [{ id: Date.now(), alunoId, data: "31/07", tipo, hora }, ...prev]);
  }

  function onMarcarTudoLido(alunoIds) {
    setAvisos((prev) => prev.map((a) => (alunoIds.includes(a.alunoId) ? { ...a, lido: true } : a)));
    setReforcos((prev) => prev.map((r) => (alunoIds.includes(r.alunoId) ? { ...r, lido: true } : r)));
  }

  const roleLabel = { pai: "Responsável", professor: "Professor(a)", admin: "Coordenação" };
  const roleUser = { pai: "Ana Paula Ferreira", professor: "Carlos Souza", admin: "Coordenação Pedagógica" };

  const meusFilhosIds = students.filter((s) => s.responsavel === "Ana Paula Ferreira").map((s) => s.id);
  const naoLidos =
    avisos.filter((a) => meusFilhosIds.includes(a.alunoId) && !a.lido).length +
    reforcos.filter((r) => meusFilhosIds.includes(r.alunoId) && !r.lido).length;

  return (
    <div className="escola-app">
      <style>{CSS}</style>

      {!loggedIn ? (
        <LoginScreen onLogin={(r) => { setRole(r); setLoggedIn(true); }} />
      ) : (
        <>
          <div className="esc-spiral" />
          <header className="esc-header">
            <div>
              <div className="esc-header-title">Colégio Trilhas</div>
              <div className="esc-header-sub">Portal Escolar</div>
            </div>
            <div className="esc-header-right">
              {role === "pai" && naoLidos > 0 && (
                <button className="esc-bell" onClick={() => onMarcarTudoLido(meusFilhosIds)} title="Marcar notificações como lidas">
                  🔔 {naoLidos} nova{naoLidos > 1 ? "s" : ""}
                </button>
              )}
              <span className="esc-postit">{roleLabel[role]}</span>
              <span className="esc-header-user">{roleUser[role]}</span>
              <button className="esc-btn esc-btn--ghost esc-btn--sm" onClick={() => setLoggedIn(false)}>Sair</button>
            </div>
          </header>

          {role === "pai" && (
            <PaiDashboard
              students={students.filter((s) => s.responsavel === "Ana Paula Ferreira")}
              avisos={avisos}
              reforcos={reforcos}
              registros={registros}
              onConfirmarReforco={onConfirmarReforco}
            />
          )}
          {role === "professor" && (
            <ProfessorDashboard
              students={students}
              avisos={avisos}
              reforcos={reforcos}
              onUpdateNota={onUpdateNota}
              onUpdateFrequencia={onUpdateFrequencia}
              onAddAviso={onAddAviso}
              onAddReforco={onAddReforco}
            />
          )}
          {role === "admin" && (
            <AdminDashboard
              students={students}
              reforcos={reforcos}
              avisos={avisos}
              registros={registros}
              onAddComunicado={onAddComunicado}
              onAddAluno={onAddAluno}
              onAddRegistro={onAddRegistro}
            />
          )}
        </>
      )}
    </div>
  );
}
